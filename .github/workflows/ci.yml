# VFF - Intégration continue
#
#   php     : composer audit, Pint, contrôle i18n (vff:i18n-check), registre des sources (vff:source-rights --check),
#             PHPStan + Larastan (niveau 6, baseline), contrôles statiques (tests/Unit/Static)
#   phpunit : suite PHPUnit complète sur PostgreSQL 18 + PostGIS 3.7, en parallèle (un processus par cœur du runner,
#             une base vff_test_test_<n> par processus), en même temps que le job php
#   front : pnpm install, pnpm audit, Prettier, ESLint, vitest, svelte-check (baseline), build Vite
#   e2e   : suite Playwright de fumée (tests/e2e) contre l'application démarrée sur une base migrée et
#           remplie par E2eSeeder (jeu de données minimal), PostgreSQL + PostGIS et Valkey en services
#
# Analyse statique (PHPStan, svelte-check) : la dette existante est gelée dans
# phpstan-baseline.neon et svelte-check-baseline.json ; toute NOUVELLE erreur bloque.
#
# Style (Pint / Prettier) : contrôle complet et bloquant, le dépôt entier est
# au format depuis le 20/11/2026 (cf. README › Qualité).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Aucun droit par défaut : chaque tâche demande seulement ce dont elle a besoin.
permissions: {}

jobs:
  php:
    name: PHP 8.5 - Pint, i18n, PHPStan, contrôles statiques
    runs-on: ubuntu-latest
    # Mesuré le 22/11/2026 : environ 3 min (PHPStan en tête) ; PHPUnit tourne à part, dans le job phpunit.
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: vff
          POSTGRES_PASSWORD: vff
          # Les tests visent obligatoirement une base suffixée _test (cf. phpunit.xml).
          POSTGRES_DB: vff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vff -d vff_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: vff
      DB_PASSWORD: vff

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, intl, zip, bcmath, pcntl, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Failles connues des dépendances PHP (composer audit)
        run: composer audit --no-interaction --locked

      - name: Préparer .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint
        run: vendor/bin/pint --test

      - name: Traductions (FR → EN, DE)
        run: php artisan vff:i18n-check --ansi

      # Les provenances sont lues en base : migrer d'abord la base jetable du service
      # (vide, donc seule la cohérence du registre est vérifiée ici ; les tests refont leur migration).
      - name: Registre des sources et licences (vff:source-rights --check)
        env:
          DB_DATABASE: vff_test
        run: |
          php artisan migrate --force --no-interaction
          php artisan vff:source-rights --check

      - name: Cache PHPStan
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/framework/cache/phpstan
          key: phpstan-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-baseline.neon') }}-${{ github.sha }}
          restore-keys: phpstan-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-baseline.neon') }}-

      - name: PHPStan + Larastan (nouvelles erreurs bloquantes)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

      - name: Contrôles statiques (tirets, clés i18n, palette carte, routes)
        run: php artisan test tests/Unit/Static --ansi

  # PHPUnit séparé du job php : il démarre aussitôt au lieu d'attendre PHPStan, et donne son verdict même quand
  # l'analyse statique échoue. Les processus parallèles ont chacun leur base (vff_test_test_1 à _<n>), créée et
  # migrée par Laravel à partir de vff_test ; le garde-fou de tests/CreatesApplication.php accepte ces noms.
  phpunit:
    name: PHPUnit (parallèle)
    runs-on: ubuntu-latest
    # Avant le 23/11/2026 : 10 à 14 min de PHPUnit sur un seul processus (10 300 tests), 19 au pire ; en parallèle
    # sur les 4 cœurs du runner, environ le tiers. 20 laisse la marge d'un runner lent sans laisser traîner une suite bloquée.
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: vff
          POSTGRES_PASSWORD: vff
          # Les tests visent obligatoirement une base suffixée _test (cf. phpunit.xml).
          POSTGRES_DB: vff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vff -d vff_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: vff
      DB_PASSWORD: vff

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, intl, zip, bcmath, pcntl, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Options de parallélisme AVANT toute autre option (docs/TESTS.md, piège 1).
      - name: PHPUnit (un processus par cœur)
        run: php artisan test --parallel --processes="$(nproc)" --ansi

  front:
    name: Front - Prettier, ESLint, svelte-check, build Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Version de pnpm lue dans package.json (`packageManager`).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Version de Node lue dans .nvmrc (LTS active, la même que bin/pnpm et `engines`).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Failles connues des dépendances JS (pnpm audit)
        run: pnpm audit

      - name: Prettier
        run: pnpm lint

      - name: ESLint (bugs JS / Svelte)
        run: pnpm lint:js

      - name: Tests vitest (utilitaires du front)
        run: pnpm test

      - name: svelte-check (JSDoc, nouvelles erreurs bloquantes)
        run: pnpm check

      - name: Build Vite
        run: pnpm build

  # Suite de fumée Playwright (docs/TESTS-E2E.md) : l'application tourne pour de vrai (PHP, PostgreSQL, Valkey,
  # build Vite) sur le jeu de données minimal de database/seeders/E2eSeeder.php. Le rapport HTML est publié
  # en artefact quand un test échoue.
  e2e:
    name: E2E - Playwright (fumée)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: vff
          POSTGRES_PASSWORD: vff
          # Suffixe _test obligatoire : E2eSeeder refuse toute autre base.
          POSTGRES_DB: vff_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vff -d vff_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vff_e2e_test
      DB_USERNAME: vff
      DB_PASSWORD: vff
      REDIS_HOST: 127.0.0.1
      APP_DEBUG: 'false'
      E2E_BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, intl, zip, bcmath, pcntl, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Migrations et jeu de données minimal
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --class='Database\Seeders\E2eSeeder' --force --no-interaction

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build Vite
        run: pnpm build

      - name: Démarrer l'application
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php artisan serve --host=127.0.0.1 --port=8000 --no-reload > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "$E2E_BASE_URL/lines/rfn-878000" && exit 0
            sleep 1
          done
          cat storage/logs/serve.log
          exit 1

      # Navigateur gardé en cache, clé sur la version de Playwright réellement installée (pnpm-lock.yaml). Les
      # bibliothèques système ne sont installées (apt) que si Chromium ne démarre pas sans elles.
      - name: Version de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Navigateur Chromium
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != 'true' ]; then
            pnpm exec playwright install chromium
          fi
          if ! pnpm exec node -e "import('@playwright/test').then(async ({ chromium }) => (await chromium.launch()).close())"; then
            pnpm exec playwright install-deps chromium
          fi

      - name: Suite de fumée Playwright
        env:
          CI: '1'
        run: pnpm test:e2e

      - name: Rapport Playwright (artefact)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            storage/app/reports/e2e/html
            storage/app/reports/e2e/traces
          retention-days: 7
          if-no-files-found: ignore
