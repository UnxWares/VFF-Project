; Pool PHP-FPM de VFF (SERVEUR de production seulement). Parcours complet : docs/MISE-EN-PRODUCTION.md.
; Installation : /etc/php/8.5/fpm/pool.d/vff.conf, puis « php-fpm8.5 -t » et « systemctl reload php8.5-fpm ».
; Le socket est celui de l'upstream vff_php de deploy/nginx/vff-project.org.conf.
[vff]
user = vff
group = vff

listen = /run/php/php8.5-fpm-vff.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Processus : à ajuster à la mémoire du serveur (environ 60 à 120 Mo par processus actif).
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
request_terminate_timeout = 75s

; Pas de journal d'accès : il écrirait la chaîne de requête (position de « Autour de moi »,
; docs/DEPLOIEMENT-NGINX.md). Les erreurs vont au journal de PHP-FPM.
; access.log reste désactivé, ne pas l'activer avec %q ou %{REQUEST_URI}e.
catch_workers_output = yes
decorate_workers_output = no

; Seul public/index.php est exécuté (nginx n'envoie rien d'autre).
security.limit_extensions = .php

; Dépôts d'image de 10 Mo au plus (MediaContributions::MAX_KILOBYTES), corps de 12 Mo comme nginx.
php_admin_value[upload_max_filesize] = 11M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 60
php_admin_value[date.timezone] = Europe/Paris
; Pas d'arguments de fonctions dans les piles d'erreurs (un mot de passe passé à une fonction y figurerait).
php_admin_flag[zend.exception_ignore_args] = on
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[opcache.enable] = on
; Le code change à chaque déploiement : OPcache revérifie les fichiers. La taille d'OPcache
; (opcache.memory_consumption) se règle dans php.ini, pas dans un pool.
php_admin_flag[opcache.validate_timestamps] = on
