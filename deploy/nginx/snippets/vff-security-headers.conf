# En-têtes de sécurité des fichiers que nginx envoie lui-même (statiques, archive PMTiles).
# Mêmes valeurs que App\Http\Middleware\SecurityHeaders (constantes HSTS et PERMISSIONS_POLICY).
#
# À inclure dans CHAQUE location qui sert un fichier : nginx n'hérite des add_header du niveau
# supérieur que si la location n'en déclare aucun. Ne PAS l'inclure dans les locations qui passent
# par PHP-FPM : Laravel pose déjà ces en-têtes, on aurait des doublons.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), geolocation=(self), interest-cohort=()" always;
