# Temps réel : proxy WebSocket vers Laravel Reverb (docs/DEPLOIEMENT-NGINX.md, section « Temps réel »).
# Inclus dans le bloc server de vff-project.org seulement quand Reverb tourne (REALTIME_ENABLED=true) :
# décommenter la ligne `include /etc/nginx/snippets/vff-reverb.conf;` du site.
#
# Le navigateur ouvre wss://vff-project.org/app/<REVERB_APP_KEY>. Seul /app/ est public : l'API HTTP
# de Reverb (/apps/<id>/events), qui reçoit les événements de Laravel, reste sur 127.0.0.1:8080 et
# n'est jamais exposée.
location ^~ /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Connexions longues : Reverb envoie un ping toutes les 60 s (REVERB_APP_PING_INTERVAL).
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}
