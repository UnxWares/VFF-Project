# TLS : profil « intermédiaire » (TLS 1.2 et 1.3), sessions reprises, agrafage OCSP.
# HSTS est posé par Laravel (pages, API) et par vff-security-headers.conf (fichiers statiques).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:vff_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# Agrafage OCSP : avertissement sans gravité avec un certificat factice (pas de serveur OCSP).
ssl_stapling on;
ssl_stapling_verify on;
resolver 9.9.9.9 1.1.1.1 valid=300s ipv6=off;
resolver_timeout 5s;
