# Transmission à PHP-FPM (Laravel : tout passe par public/index.php).
# Aucun add_header ici : les en-têtes de sécurité viennent de Laravel (SecurityHeaders).
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
fastcgi_param DOCUMENT_ROOT   $realpath_root;
fastcgi_param HTTPS           on;
fastcgi_pass  vff_php;
fastcgi_read_timeout 60s;
fastcgi_send_timeout 60s;
fastcgi_buffer_size 16k;
fastcgi_buffers 16 16k;
# Jamais de mise en cache d'une réponse PHP par nginx.
fastcgi_cache off;
