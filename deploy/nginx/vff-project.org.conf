# VFF (Voies Ferrées de France) : site vff-project.org, configuration nginx de référence.
# Explications bloc par bloc et points à adapter : docs/DEPLOIEMENT-NGINX.md.
#
# Installation : copier ce fichier dans /etc/nginx/conf.d/ (il contient des directives de contexte
# http, donc pas dans sites-enabled si celui-ci est inclus dans un server), le dossier snippets/ dans
# /etc/nginx/snippets/ et, si besoin, les fichiers de optional/ dans /etc/nginx/vff-optional/.
#
# À adapter : racine du dépôt (/srv/vff), socket PHP-FPM, certificats, dossier de l'archive PMTiles.

# ---------------------------------------------------------------------------------------------
# Contexte http : PHP-FPM, journaux, limites
# ---------------------------------------------------------------------------------------------

upstream vff_php {
    server unix:/run/php/php8.5-fpm-vff.sock;
    keepalive 8;
}

# Journaux sans adresse complète : IPv4 tronquée au dernier octet (a.b.c.0), IPv6 gardée sur ses
# deux premiers groupes. Suffit à repérer un abus, sans identifier une personne. La limitation de
# débit ci-dessous et celle de Laravel travaillent, elles, sur l'adresse réelle, en mémoire seulement.
map $remote_addr $vff_ip_anonyme {
    ~^(?P<a>\d+\.\d+\.\d+)\.\d+$       $a.0;
    ~^(?P<b>[0-9a-f]+:[0-9a-f]+):      $b::;
    default                            0.0.0.0;
}

# Chemin sans la chaîne de requête (elle peut contenir un jeton ou une adresse électronique).
log_format vff '$vff_ip_anonyme - [$time_local] "$request_method $uri $server_protocol" '
               '$status $body_bytes_sent "$http_user_agent" $request_time';

# Pas de journal d'accès pour les sondes de supervision (/up, /up/details) : Uptime Kuma les
# appelle toutes les minutes. `if=` s'applique aussi après la redirection interne vers index.php.
map $request_uri $vff_journaliser {
    ~^/up(/details)?(\?.*)?$  0;
    default                   1;
}

# Archive PMTiles : limite de secours devant PHP (10 requêtes par seconde, soit les 600 par minute
# de VFF_BASEMAP_REQUESTS_PER_MINUTE). Laravel applique ensuite ses propres limites.
limit_req_zone $binary_remote_addr zone=vff_basemap:10m rate=10r/s;

# Compression. Les archives PMTiles et les images (déjà compressées) n'en font pas partie.
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/geo+json application/javascript
           text/javascript application/xml image/svg+xml application/manifest+json
           application/graphql-response+json application/vnd.mapbox-vector-tile application/x-protobuf
           font/ttf;

# Compression brotli : seulement si le module est installé (voir optional/brotli.conf.example).
# Un dossier sans fichier .conf ne gêne pas nginx.
include /etc/nginx/vff-optional/*.conf;

# Navigateur : pas de numéro de version dans les en-têtes et les pages d'erreur.
server_tokens off;

# ---------------------------------------------------------------------------------------------
# HTTP : redirection vers HTTPS (sauf le défi du renouvellement des certificats)
# ---------------------------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name vff-project.org www.vff-project.org;

    access_log /var/log/nginx/vff-access.log vff if=$vff_journaliser;
    error_log  /var/log/nginx/vff-error.log warn;

    # Défi HTTP-01 (certbot, acme.sh...), dossier à adapter.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://vff-project.org$request_uri;
    }
}

# ---------------------------------------------------------------------------------------------
# HTTPS : www vers le nom sans www
# ---------------------------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vff-project.org;

    ssl_certificate     /etc/letsencrypt/live/vff-project.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vff-project.org/privkey.pem;
    include /etc/nginx/snippets/vff-tls.conf;

    access_log /var/log/nginx/vff-access.log vff if=$vff_journaliser;

    location / {
        include /etc/nginx/snippets/vff-security-headers.conf;
        return 301 https://vff-project.org$request_uri;
    }
}

# ---------------------------------------------------------------------------------------------
# HTTPS : le site
# ---------------------------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vff-project.org;

    ssl_certificate     /etc/letsencrypt/live/vff-project.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vff-project.org/privkey.pem;
    include /etc/nginx/snippets/vff-tls.conf;

    root /srv/vff/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/vff-access.log vff if=$vff_journaliser;
    error_log  /var/log/nginx/vff-error.log warn;

    # Taille des corps : celle de api.max_body_bytes (2 Mio) pour GraphQL, MCP et l'API. Laravel
    # répond ensuite 413 avec un message clair ; nginx coupe seulement ce qui dépasse largement.
    # Les dépôts d'image (10 Mo de fichier au plus) ont leur propre limite plus bas.
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;

    # --- Fichiers cachés et fichiers du dépôt jamais servis -----------------------------------
    location ~ /\.(?!well-known/) {
        return 404;
    }
    # Aucun script PHP exécuté ni servi hors de index.php.
    location ~ \.php$ {
        return 404;
    }
    # Manifeste Vite : inutile au navigateur.
    location = /build/manifest.json {
        return 404;
    }

    # --- Sondes de supervision (sans journal d'accès, voir $vff_journaliser) ------------------
    # /up : sonde simple de Laravel. /up/details : état détaillé, protégé par HEALTH_TOKEN
    # (en-tête Authorization: Bearer), limiteur `health` de Laravel.
    location = /up {
        try_files $uri /index.php?$query_string;
    }
    location = /up/details {
        try_files $uri /index.php?$query_string;
    }

    # --- Fichiers hachés de Vite : le nom change à chaque contenu, cache d'un an, immuable ----
    location ^~ /build/assets/ {
        include /etc/nginx/snippets/vff-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Service worker et manifeste PWA : toujours revalidés (un SW trop gardé bloque les mises à jour)
    location = /sw.js {
        include /etc/nginx/snippets/vff-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/javascript;
        try_files $uri =404;
    }
    location = /build/sw.js {
        include /etc/nginx/snippets/vff-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/javascript;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/vff-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # --- Fond de carte : glyphes (Noto Sans, .pbf), versionnés avec l'application -------------
    location ^~ /basemap/fonts/ {
        include /etc/nginx/snippets/vff-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        default_type application/x-protobuf;
        try_files $uri =404;
    }

    # --- Fond de carte : archive PMTiles ------------------------------------------------------
    # La requête passe par Laravel (BasemapArchiveController : plages d'octets, limites par
    # adresse), qui répond X-Accel-Redirect vers la location interne ci-dessous ; nginx envoie
    # alors les octets de la plage demandée (VFF_BASEMAP_ACCEL_REDIRECT=/_basemap/ dans .env).
    location ~ ^/basemap/[a-z0-9-]+\.pmtiles$ {
        limit_req zone=vff_basemap burst=60 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location /_basemap/ {
        internal;
        # Dossier de VFF_BASEMAP_DIRECTORY (storage/app/data/pmtiles par défaut), avec / final.
        alias /srv/vff/storage/app/data/pmtiles/;
        include /etc/nginx/snippets/vff-security-headers.conf;
        # Range et Accept-Ranges : natifs pour un fichier statique. Cache-Control, Content-Type et
        # Accept-Ranges de la réponse de Laravel sont conservés par nginx lors de la redirection
        # interne (pas de add_header Cache-Control ici : il le doublerait).
        # Pas de compression : les tuiles de l'archive le sont déjà.
        gzip off;
        types { }
        default_type application/octet-stream;
        # Seulement si un autre site lit l'archive (inutile pour VFF lui-même) :
        # add_header Access-Control-Allow-Origin "*" always;
        # add_header Access-Control-Expose-Headers "ETag, Content-Range, Content-Length" always;
    }

    # --- Fichiers déposés par les membres (public/storage -> storage/app/public) --------------
    # Contenu fourni par des tiers : jamais interprété (nosniff) ni exécuté si ouvert directement.
    location ^~ /storage/ {
        include /etc/nginx/snippets/vff-security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # --- Dépôts d'image : fichier de 10 Mo au plus (MediaContributions::MAX_KILOBYTES) --------
    # Mettre aussi upload_max_filesize = 11M et post_max_size = 12M dans php.ini (PHP-FPM).
    location ~ ^/contribute/(media|series)$ {
        client_max_body_size 12m;
        client_body_timeout 120s;
        try_files $uri @vff_php_upload;
    }

    # --- Référence GraphQL (Magidoc) : pages statiques générées, sans passer par Laravel ------
    # Elles n'ont donc que les en-têtes d'ici. Politique : celle de /docs/graphql côté Laravel
    # (scripts en ligne admis sur ces pages seulement). Vérifier avec
    #   curl -sI https://vff-project.org/docs/graphql | grep -i content-security
    # puis, si la politique de Laravel change, recopier ici (voir docs/SECURITE-CSP.md).
    location ^~ /docs/graphql {
        include /etc/nginx/snippets/vff-security-headers.conf;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri.html $uri/index.html /index.php?$query_string;
    }

    # --- Images, icônes, polices, fichiers de public/ : un jour de cache ----------------------
    location ^~ /icons/ {
        include /etc/nginx/snippets/vff-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # --- Tout le reste : un fichier de public/ s'il existe, sinon Laravel ---------------------
    location / {
        include /etc/nginx/snippets/vff-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri /index.php?$query_string;
    }

    # --- PHP-FPM : seul public/index.php, atteint par redirection interne ---------------------
    location = /index.php {
        internal;
        include /etc/nginx/snippets/vff-php.conf;
    }

    # Même passage vers PHP-FPM, avec la limite de corps des dépôts d'image. nginx revérifie
    # client_max_body_size dans la location finale, après chaque redirection interne : la limite de
    # 12 Mo doit donc aussi être ici, pas seulement dans la location d'origine.
    location @vff_php_upload {
        client_max_body_size 12m;
        client_body_timeout 120s;
        include /etc/nginx/snippets/vff-php.conf;
    }

    # Erreurs : celles de Laravel (404, 419, 429...), mais 502/503/504 si PHP-FPM est arrêté
    # (page statique minimale, à fournir dans /srv/vff/public/ si souhaitée).
    # error_page 502 503 504 /maintenance.html;
}
