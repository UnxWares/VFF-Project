    gap_years: Int

    "Plus petit écart possible d'après la précision de la date (-5 pour une photo « vers 1840 » d'un événement de 1843) ; égal à `gap_years` pour une date exacte, nul quand la date n'est pas bornée."
    gap_years_min: Int

    "Plus grand écart possible (-1 dans le même exemple)."
    gap_years_max: Int

    "Vrai quand l'écart est sûr (date exacte, à l'année près). Faux : dites-le approximatif (« environ trois ans avant ») ou comme un intervalle."
    gap_exact: Boolean!

    "Vrai pour une image rattachée à l'événement lui-même (proposée puis validée pour lui)."
    attached: Boolean!

    "Le média, avec son auteur, sa licence et sa source : à afficher avec l'image."
    media: Media!
}

"Un document d'archives d'une histoire d'événement."
type LineEventStoryDocument {
    "Écart signé avec l'année de l'événement (0 quand l'intervalle du document contient cette année)."
