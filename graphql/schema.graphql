    "Lien vers l'itinéraire OSM (relation) s'il existe, sinon vers le way qui suit le plus longtemps l'emprise."
    osm_url: String!

    "Ways OSM de la voie verte sur cette ligne, le plus long sur l'emprise d'abord."
