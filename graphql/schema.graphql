"Sens d'un tri."
enum SortOrder {
    "Du plus ancien au plus récent (ou du plus petit identifiant au plus grand)."
    ASC @enum(value: "asc")

    "Du plus récent au plus ancien (ou du plus grand identifiant au plus petit)."
    DESC @enum(value: "desc")
}

"Filtres de la requête `lineEvents`. Tous sont facultatifs et se combinent (ET)."
input LineEventFilter {
    "Slug de la ligne (ex. `rfn-420000`). Une ligne inconnue est une erreur de validation."
