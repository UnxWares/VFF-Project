  "Vrai : accidents rattachés à une ligne ; faux : sans ligne."
  has_line: Boolean

  "Tri : `date` (par défaut), `-date`, `deaths`, `-deaths`. Bilan inconnu en dernier."
  sort: String
}

"Une section d'itinéraire entre deux gares consécutives du trajet."
