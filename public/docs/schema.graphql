  fetched_at: DateTime!

  "Mention de source à reproduire : « Source : gallica.bnf.fr / BnF », Licence Ouverte pour les métadonnées."
  attribution: String!

  "Fournisseur et licence de la donnée (Gallica, BnF)."
  provenance: Provenance!
}

