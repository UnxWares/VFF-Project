  "Nom de la ligne."
  line_name: String

  "Code SNCF Réseau de la ligne, à 6 chiffres."
  line_code: String

  "Longueur parcourue sur cette ligne, en mètres."
  length_m: Int!

  "Gare où le trajet prend cette ligne (nul : à un raccordement, hors gare)."
