"""
Lien entre une ligne et une série de matériel : la série a circulé (ou circule) sur la ligne
d'après une source citée. Jamais déduit d'un nom approchant : déclaration Wikidata (P3438), ou
lien posé dans une section « Matériel roulant », « Exploitation », « Desserte » de l'article
Wikipédia de la ligne, ou « Utilisation », « Services », « Carrière » de l'article de la série.
"""
type LineMaterialLink {
  "La ligne."
  line: Line!

  "La série de matériel."
  material: Material!

  """
  Provenance du lien : `wikidata`, `wikipedia`, `contrib` (proposé par des contributeurs avec leur
  source et validé par deux relecteurs), ou nulle pour un lien saisi dans VFF. Un même couple ligne ×
  série peut avoir un lien par provenance.
  """
  source: String

  "Permalien de la source la plus forte (révision Wikipédia `oldid` ou élément Wikidata) : à citer."
  source_url: String

  """
  Fiabilité : `high` (Wikidata, ou section « Matériel roulant » de l'article de la ligne),
  `medium` (autre section), `low` (à confirmer : article qui décrit plusieurs lignes de VFF à la
  fois, ou preuves qui portent toutes un doute, voir `LineMaterialEvidence.doubt`). Lien `contrib` :
  `high` dès qu'une contribution déclare un service régulier, `low` si toutes parlent d'une
  circulation exceptionnelle, d'essais ou d'un train de musée.
  """
  confidence: String

  "Ère VFF à laquelle le lien est rattaché, quand la source la date. Souvent nulle."
  era: Era

  "Début de la circulation saisi dans VFF : nul pour les liens importés, dont les dates lues dans les sources sont dans `periods`."
  from_date: Date

  "Fin de la circulation saisie dans VFF : nulle pour les liens importés (voir `periods`)."
  to_date: Date

  """
  Périodes de circulation de la série sur la ligne, datées par une source, de la plus ancienne à la
  plus récente. Seules les périodes sûres (`high`, `medium`) sont servies ; liste vide quand aucune
  source ne date la circulation.
  """
  periods: [LineMaterialPeriod!]!

  "Note libre (liens saisis dans VFF)."
  notes: String

  """
  Fin de circulation de la série sur la ligne, telle que les sources la connaissent (jamais déduite),
  comme `end` de `GET /api/v1/lines/{line}/materials` et de `LineSheet.materials` : `kind`, `year`,
  `since`, `source` et `source_url`.
  """
  end: LineSheetMaterialEnd!

  """
  Relations que la série assurait sur la ligne, lues dans l'article Wikipédia de la série (relation entre
  deux gares, ou itinéraire comme « Ligne de Paris à Granville »), une par libellé, avec les périodes qui
  les datent. Liste vide quand aucune preuve ne cite de relation ; les preuves qui portent un doute ne
  sont pas reprises.
  """
  relations: [LineMaterialRelation!]!

  "Preuves du lien, les plus fortes d'abord (cinq au plus)."
  evidence: [LineMaterialEvidence!]!

  "Fournisseur et licence de la source du lien."
  provenance: Provenance!

  """
  Comme `LineSheetMaterial.link_doubt` : raison du doute quand toutes les preuves de la série sur la ligne
  en portent un et qu'aucune période n'est datée (`trial`, `one_off`, `order`…), nulle pour une série qui a
  circulé. Calculé sur tous les liens de la série sur la ligne.
  """
  link_doubt: String

  """
  Comme `LineSheetMaterial.earliest_on_line` : borne « pas avant la première électrification connue » d'une
  série électrique, avec `conflict` quand une période sourcée commence avant (la période garde sa date).
  """
  earliest_on_line: LineSheetMaterialBound

  "Comme `LineSheetMaterial.family` : famille dont la série est une version, quand la famille est aussi liée à la ligne."
  family: LineSheetMaterialFamily

  "Vrai pour une famille que la fiche de la ligne ne montre pas, parce qu'une de ses versions liées à la ligne a circulé."
  folded_into_versions: Boolean!
}

"Portion de la ligne parcourue pendant une période de circulation, placée sur le tracé."
type LineMaterialPeriodPortion {
  "`stations` (deux gares de la ligne), `landmarks` (un point remarquable au moins, comme une bifurcation) ou `line` (la portion couvre la ligne entière)."
  location: String!

  "Première extrémité : gare (`id`, `name`) ou point remarquable (`id` nul, nom tel qu'écrit)."
  from: LineMaterialPortionEnd

  "Seconde extrémité (voir `from`)."
  to: LineMaterialPortionEnd

  "PK de début de la portion, en mètres (PK calé de la gare ou du point, jamais l'abscisse brute d'un tracé)."
  pk_start_m: Int

  "PK de fin de la portion, en mètres (au moins `pk_start_m`)."
  pk_end_m: Int
}

"Extrémité d'une portion parcourue : gare de la ligne, ou point remarquable sans gare."
type LineMaterialPortionEnd {
  "Gare (`stations.id`), nulle pour un point remarquable."
  id: Int

  "Nom lisible de la gare, ou nom du point tel que la source l'écrit."
  name: String!
}

"""
Période de circulation d'une série sur une ligne, lue dans une source datée : phrase d'un article
Wikipédia qui relie la série et la ligne (faits seulement, CC BY-SA 4.0, la phrase n'est jamais
servie) ou qualificatifs de date d'une déclaration Wikidata P3438 (CC0). Une date à l'année s'écrit
au 1er janvier, une date au mois au 1er du mois : lisez toujours la précision.
"""
type LineMaterialPeriod {
  "Début de la circulation (`AAAA-MM-JJ`), nul si la source ne donne que la fin (« jusqu'en 1990 »)."
  start_date: Date

  "Précision du début : `day`, `month` ou `year`. Nulle sans début."
  start_precision: String

  "Fin de la circulation (`AAAA-MM-JJ`), nulle si la source ne la donne pas : une fin nulle ne veut pas dire que la série y circule encore."
  end_date: Date

  "Précision de la fin : `day`, `month` ou `year`. Nulle sans fin."
  end_precision: String

  "Début de la portion parcourue, quand le titre de section de l'article la nomme (lieu tel qu'écrit)."
  section_from: String

  "Fin de la portion parcourue (voir `section_from`)."
  section_to: String

  "Relation assurée pendant cette période, quand la phrase datée cite une relation ou un itinéraire (sans `kind`, `title` ni `periods`). Nulle sinon."
  relation: LineMaterialRelation

  """
  Portion de la ligne parcourue, placée sur le tracé par ses gares d'extrémité et leurs PK calés quand la
  source la nomme (titre de section, relation citée, portion écrite dans la phrase datée), comme `portion` de
  `GET /api/v1/lines/{line}/materials`. Nulle quand aucune portion n'est nommée ou qu'elle n'a pas pu être
  placée sûrement : la période vaut alors pour la ligne, sans précision.
  """
  portion: LineMaterialPeriodPortion

  "Fiabilité : `high` (chaque date au jour ou au mois) ou `medium` (une date à l'année). Les périodes `low` ne sont jamais servies."
  confidence: String!

  "Où le fait a été lu : `line_article` (article de la ligne), `material_article` (article de la série), `wikidata` ou `contribution` (proposée par un contributeur avec sa source, validée par deux relecteurs)."
  origin: String!

  "Fournisseur de la source : `wikipedia`, `wikidata` ou `contrib` (contribution validée)."
  source: String!

  "Titre de l'article Wikipédia lu, élément Wikidata de la ligne (`Q…`), ou titre et licence de la source d'une contribution."
  source_title: String

  "Révision de l'article lue (`oldid`), nulle pour Wikidata et les contributions."
  source_revision: Int

  "Permalien de la source (révision Wikipédia, élément Wikidata, adresse citée par le contributeur) : à citer. Nul seulement pour une contribution qui cite un ouvrage ou une archive papier par sa référence (`source_title`)."
  source_url: String

  "Fournisseur et licence de la source."
  provenance: Provenance!
}

"""
Relation assurée par une série sur une ligne (« Paris-Montparnasse - Granville »), lue dans l'article
Wikipédia de la série : relation entre deux gares, rattachée aux lignes du plus court chemin du graphe de
l'époque quand il est sans ambiguïté, ou lien vers un article d'itinéraire qui enchaîne plusieurs lignes.
"""
type LineMaterialRelation {
  "`relation` (gares citées par la phrase) ou `itinerary` (article d'itinéraire, voir `title`). Nul dans `LineMaterialPeriod.relation`."
  kind: String

  "Libellé : gares d'extrémité (et arrêts cités) séparées par « - », noms tels qu'en base."
  label: String!

  "Gare de départ."
  from: LineMaterialRelationStop

  "Gare d'arrivée."
  to: LineMaterialRelationStop

  "Type de service cité par la phrase ou la section : `TER`, `Intercités`, `TGV`, `grandes lignes`, `express`, `omnibus`, `fret`, ou nul."
  service: String

  "Titre de l'article Wikipédia de l'itinéraire (`kind` = `itinerary`), nul pour une relation."
  title: String

  "Périodes montrées qui datent cette relation (dans `LineMaterialLink.relations` seulement)."
  periods: [LineMaterialRelationPeriod!]

  "Faits sourcés sur cette relation (carburant…), lus dans `database/data/material_relation_notes.php` ; liste vide sans fait connu. Nul dans `LineMaterialPeriod.relation`."
  notes: [LineMaterialRelationNote!]
}

"""
Fait sourcé sur une relation assurée par une série, hors Wikipédia : par exemple le Régiolis sur
Paris - Granville, au biodiesel B100 (colza) depuis avril 2021, d'après un communiqué de janvier 2023.
"""
type LineMaterialRelationNote {
  "Nature du fait : `fuel` (carburant de la série sur cette relation)."
  kind: String!

  "Carburant (`kind` = `fuel`), tel que la source le nomme : `B100` (biodiesel 100 % d'origine végétale)."
  fuel: String

  "Matière première du carburant : `rapeseed` (colza)."
  feedstock: String

  "Début (`AAAA-MM-JJ`, au 1er du mois pour une date au mois : lisez `since_precision`)."
  since: String

  "Précision du début : `day`, `month` ou `year`."
  since_precision: String

  "Date de la source la plus récente qui atteste le fait (un bilan, pas une fin) : sans source plus récente, on ne sait pas si c'est toujours le cas."
  reported: String

  "Précision de `reported` : `day`, `month` ou `year`."
  reported_precision: String

  "Sources citées, la plus récente d'abord."
  sources: [LineMaterialRelationNoteSource!]!
}

"Source d'un fait sur une relation (communiqué, dépêche) : fait isolé repris avec lien."
type LineMaterialRelationNoteSource {
  "Titre de la page ou du document."
  title: String!

  "Éditeur (« Région Normandie, SNCF Voyageurs et Saipol (Oleo100), communiqué de presse »)."
  publisher: String!

  "Date de publication (`AAAA-MM-JJ`)."
  date: String!

  "Adresse de la source : à citer."
  url: String!

  "Fournisseur déclaré dans le registre des droits (`tiers-cites` : sites cités ponctuellement), nul s'il n'est pas déclaré."
  provider: String

  "Conditions de reprise du fournisseur, telles que le registre les décrit."
  license: String

  "Statut des droits du fournisseur : `sur`, `incertain` ou `interdit`."
  license_status: String
}

"Gare d'extrémité d'une relation."
type LineMaterialRelationStop {
  "Identifiant de la gare dans VFF, nul si le nom n'a pas été identifié."
  id: Int

  "Nom de la gare tel qu'en base (ou tel qu'écrit par la source si `id` est nul)."
  name: String!
}

"Période qui date une relation (forme courte de `LineMaterialPeriod`)."
type LineMaterialRelationPeriod {
  "Début (`AAAA-MM-JJ`), nul si seule la fin est connue."
  start_date: String

  "Précision du début : `day`, `month` ou `year`."
  start_precision: String

  "Fin (`AAAA-MM-JJ`), nulle si la source ne la donne pas."
  end_date: String

  "Précision de la fin : `day`, `month` ou `year`."
  end_precision: String
}

"""
Une preuve d'un lien ligne × matériel. Les phrases citées sont des extraits de Wikipédia
(CC BY-SA 4.0) : citez l'article avec le permalien `url`.
"""
type LineMaterialEvidence {
  "`wikipedia_line_article` (lien vers la série dans l'article de la ligne), `wikipedia_material_article` (lien vers la ligne dans l'article de la série), `wikidata` ou `contribution` (contribution validée)."
  kind: String!

  "Provenance d'une preuve `contribution` : `contribution:<id>`."
  contribution: String

  "Titre ou référence de la source citée par une contribution (ex. « Livret Chaix d'été 1938, p. 112 »)."
  title: String

  "Nature de la source citée par une contribution : `web`, `document` (document numérisé) ou `print` (ouvrage ou archive papier)."
  source_kind: String

  "Licence du document cité par une contribution (`public_domain`, `cc-by-sa-4.0`, `all_rights_reserved`…), nulle pour une page web ou un ouvrage papier."
  license: String

  "Titre de l'article Wikipédia lu."
  article: String

  "Révision de l'article lue (identifiant `oldid`)."
  revid: Int

  "Titre de la section (« Section > Sous-section »), qui précise parfois la portion parcourue."
  section: String

  "Phrase (ou ligne de liste, de tableau) qui porte le lien."
  quote: String

  "Propriété Wikidata (`P3438`, véhicule habituellement utilisé)."
  property: String

  "Élément Wikidata de la ligne qui porte la déclaration."
  subject: String

  "Première année déclarée par Wikidata (qualificatif P580)."
  from_year: Int

  "Dernière année déclarée par Wikidata (qualificatif P582)."
  to_year: Int

  "Vrai si l'article décrit plusieurs lignes de VFF à la fois."
  shared_article: Boolean

  """
  Raison de douter que la série ait roulé en service sur la ligne d'après cette phrase, ou nul :
  `order` (commande, contrat), `trial` (essai, record), `one_off` (circulation exceptionnelle,
  spéciale, présentation), `preserved` (musée, préservation), `possible` (simple possibilité),
  `positioning` (acheminement vers un atelier), `diverted` (coupure, détournement), `restricted`
  (matériel réservé à une autre ligne), `component` (pièce reprise de la série), `footnote` (lien
  posé dans une note ou un passage sans source), `section` (section d'essais, de records ou de
  préservation). Un lien dont toutes les preuves portent un doute est en fiabilité `low`. Pour une
  contribution, la circulation déclarée : `one_off` (exceptionnelle), `trial` (essais), `preserved`
  (train de musée ou touristique), nul pour un service régulier.
  """
  doubt: String

  "Relation ou itinéraire cité par l'article de la série qui a donné cette preuve (voir `LineMaterialLink.relations`), nul pour une preuve tirée d'un lien direct vers la ligne."
  route: LineMaterialRelation

  "Permalien de la preuve."
  url: String
}

"""
Un accident ou un événement grave du rail français : date et précision, nature, lieu, lignes
rattachées, bilan humain et sa source, résumé, sources ouvertes avec leur licence.

Faits recoupés entre Wikidata (CC0), Wikipédia (faits seulement, CC BY-SA 4.0 pour toute
citation) et le bilan général des enquêtes du BEA-TT (Licence Ouverte 2.0), par
`vff:import-accidents`. Un champ nul veut dire qu'aucune source consultée ne le donne : VFF
n'estime aucune valeur. Aucune victime n'est nommée.
"""
type Accident {
  "Identifiant interne de l'accident."
  id: ID!

  "Identifiant stable et lisible : date (selon sa précision) puis commune (ex. `2013-07-12-bretigny-sur-orge`)."
  slug: String!

  "Élément Wikidata (`Q…`), nul si l'accident n'y figure pas (accident connu par le seul BEA-TT)."
  wikidata_id: String

  "Nom usuel : libellé Wikidata, sinon nom construit par VFF (nature et commune)."
  name(
    "Langue : `fr` (par défaut), `en` ou `de`."
    lang: String = "fr"
  ): String!

  """
  Nature : `collision` (entre trains ou avec un obstacle sur la voie), `derailment`
  (déraillement), `level_crossing` (collision à un passage à niveau), `fire` (incendie),
  `explosion`, `structure_failure` (rupture d'ouvrage : pont, tunnel, mur, rail), `attack`
  (attentat), `war_action` (fait de guerre : bombardement, ouvrage détruit par une armée), `person_struck` (personnes heurtées hors passage à niveau), `runaway` (dérive),
  `incident` (incident grave sans accident : quasi-collision, dépassement de vitesse,
  immobilisation), `other`.
  """
  kind: String!

  "Date de l'accident (`AAAA-MM-JJ`), à lire avec `date_precision` (au 1er du mois ou au 1er janvier si moins précise)."
  date: Date!

  "Précision de `date` : `day` (date exacte), `month` (mois et année), `year` (année seule)."
  date_precision: String!

  "Heure locale (`HH:MM`) quand une source la donne."
  time: String

  "Commune actuelle (contours IGN ADMIN EXPRESS) où se trouve le lieu."
  commune: String

  "Code INSEE de la commune."
  commune_insee: String

  "Code INSEE du département actuel (`2A`, `2B` pour la Corse)."
  department_code: String

  "Latitude WGS 84 du lieu, en degrés décimaux ; nulle si le lieu est inconnu."
  lat: Float

  "Longitude WGS 84 du lieu, en degrés décimaux ; nulle si le lieu est inconnu."
  lng: Float

  """
  D'où vient la position : `exact` (coordonnées données par la source), `level_crossing`
  (passage à niveau cité, jeu SNCF Réseau), `station` (gare ou lieu cité), `commune` (centre
  de la commune : lieu exact inconnu). Nulle si le lieu est inconnu.
  """
  location_precision: String

  "Nombre de morts, selon `toll_source` ; nul si inconnu (0 : aucun mort)."
  deaths: Int

  "Nombre de blessés ; nul si inconnu. Les sources comptent parfois différemment : voir `review_status`."
  injuries: Int

  "Fournisseur du bilan retenu : `bea-tt` (enquête officielle, préférée), `wikidata`, `wikipedia`."
  toll_source: String

  "Lien qui appuie le bilan retenu (référence Wikidata, permalien Wikipédia, rapport du BEA-TT)."
  toll_source_url: String

  "Résumé rédigé par VFF à partir des faits retenus, jamais recopié d'une source."
  summary(
    "Langue : `fr` (par défaut), `en` ou `de`."
    lang: String = "fr"
  ): String!

  "Article de Wikipédia sur l'accident dans la langue demandée, nul s'il n'existe pas."
  wikipedia_url(
    "Langue : `fr` (par défaut), `en` ou `de`."
    lang: String = "fr"
  ): String

  "`ok` : date et lieu confirmés par une source primaire (enquête du BEA-TT) ou par deux sources indépendantes (voir `verification`) ; `to_review` quand un point reste incertain (voir `review_notes`). Le rattachement à une ligne porte sa propre confiance."
  review_status: String!

  """
  Vérification de la date et du lieu (`vff:verify-accidents`) : `rule` (`primary_source`, `two_sources`,
  `wikidata_wikipedia`, `wikipedia_editions` ou absente), `date` et `place` (valeur retenue ; sources qui concordent `confirmed_by`,
  qui divergent `disagreeing`, communes voisines `nearby`, chacune avec `provider`, `role`, `url` et la date de
  lecture `retrieved_at` ; une source `bea-tt` dont la page d'enquête a été relue ajoute `report` : `title`, `url`, et `number` et `published` quand ils sont connus), `families` (familles qui confirment : `official`, `wikipedia`, `wikidata`, `wikidata-bare`, `wikipedia-edition` pour les listes de Wikipédia en anglais et en allemand, `press` pour la presse d'époque numérisée),
  `deaths` (bilan comparé aux articles de presse), `kind` (nature lue dans une source), `aliases` (autres éléments Wikidata du
  même accident, gardés avec leurs sources). Nul si la fiche n'a pas été vérifiée.
  """
  verification: JSON

  "Date de la dernière vérification, nulle si la fiche n'a pas été vérifiée."
  verified_at: DateTime

  """
  Fournisseur de chaque fait retenu, comme `provenance` de `GET /api/v1/accidents/{slug}` : clés `date`,
  `kind`, `location`, `deaths`, `injuries` et `name` (`vff` : nom construit par VFF) ; `kind` vaut `context`
  quand la nature a été corrigée d'après les documents du contexte, `label` pour une nature tirée du seul
  nom. Objet vide si aucun fait n'est attribué.
  """
  provenance: JSON!

  "Date du dernier import de la fiche (ISO 8601)."
  imported_at: DateTime!

  "Nature en toutes lettres (« Déraillement »), comme `kind_label` de l'API REST."
  kind_label(
    "Langue : `fr` (par défaut), `en` ou `de`."
    lang: String = "fr"
  ): String!

  "Nom du département actuel du lieu (« Hérault »), comme `place.department` de l'API REST ; nul si le département est inconnu."
  department_name: String

  "Points incertains : bilans ou dates qui diffèrent selon les sources, lieu vague, ligne incertaine."
  review_notes: [AccidentReviewNote!]!

  "Trains et matériel impliqués, quand les sources les nomment."
  trains: [AccidentTrain!]!

  "Lignes rattachées, avec la portion, le PK estimé, la méthode et la confiance (ordre non garanti : la principale a `is_primary`)."
  lines: [AccidentLineLink!]!

  "Gare VFF la plus proche du lieu, ouverte à la date quand ses dates sont connues (10 km au plus)."
  nearest_station: Station

  "Distance du lieu à `nearest_station`, en mètres."
  nearest_station_distance_m: Int

  "Sources consultées, avec leur licence et les faits lus dans chacune."
  sources: [AccidentSource!]!

  """
  Contexte sourcé (circonstances, déroulement, victimes, causes, suites, mémoire, contradictions entre
  sources), rédigé par VFF à partir de documents lus, avec ces documents, les images de Wikimedia Commons et
  les corrections faites d'après eux. Listes vides si la fiche n'a pas encore de contexte. Même contenu que
  `context` de `GET /api/v1/accidents/{slug}`.
  """
  context: AccidentContext!
}

"Contexte sourcé d'un accident (vff:enrich-accidents)."
type AccidentContext {
  "Date de la recherche documentaire (nulle si la fiche n'a pas de contexte)."
  checked_on: Date

  "Sections dans l'ordre de lecture ; une section sans énoncé est omise."
  sections: [AccidentContextSection!]!

  "Documents consultés. Un énoncé cite leurs `key`."
  references: [AccidentReference!]!

  "Images du domaine public ou sous licence libre (usage commercial permis), auteur et licence relus sur Commons."
  images: [AccidentImage!]!

  "Valeurs de la fiche corrigées d'après ces documents."
  corrections: [AccidentCorrection!]!
}

"Section du contexte d'un accident."
type AccidentContextSection {
  """
  `circumstances` (trains, horaires, lieu exact), `course` (déroulement), `victims` (bilan et secours, aucune
  victime nommée), `causes` (causes établies par l'enquête), `aftermath` (procès, rapports, mesures de sécurité
  adoptées), `memory` (monuments, commémorations), `disagreements` (contradictions entre les sources).
  """
  section: String!

  "Énoncés, dans l'ordre."
  entries: [AccidentContextEntry!]!
}

"Énoncé du contexte, rédigé par VFF et appuyé sur au moins un document lu."
type AccidentContextEntry {
  "Texte de l'énoncé."
  text(
    "Langue : `fr` (par défaut), `en` ou `de`."
    lang: String = "fr"
  ): String!

  "Clés des documents (`AccidentReference.key`) qui appuient l'énoncé."
  references: [String!]!

  "Courte citation exacte d'un document sous Licence Ouverte (rapport du BEA-TT, Journal officiel) ; une au plus par fiche, nulle sinon."
  quote: AccidentQuote
}

"Courte citation exacte (200 caractères au plus)."
type AccidentQuote {
  "Texte cité, tel quel."
  text: String!

  "Langue du texte cité (`fr`, `en` ou `de`)."
  lang: String!

  "Clé du document cité (`AccidentReference.key`)."
  reference: String!
}

"Document consulté pour le contexte d'un accident."
type AccidentReference {
  "Clé du document dans la fiche."
  key: String!

  "Fournisseur selon le registre des droits de VFF (`bea-tt`, `legifrance`, `assemblee-nationale`, `senat`, `gallica`, `retronews`, `persee`, `archives-departementales`, `presse`, `ouvrages`, `sites-web`, `wikipedia`…)."
  provider: String!

  "`report`, `official`, `parliament`, `press`, `book`, `scholarly`, `archive`, `memorial`, `web`, `forum`, `encyclopedia`, `data` ou `video`."
  kind: String!

  "Fiabilité : `official`, `scholarly`, `press`, `local_history`, `association`, `encyclopedia` ou `forum`."
  reliability: String!

  "Titre du document."
  title: String!

  "Journal, site ou éditeur."
  publisher: String

  "Auteur, s'il est indiqué."
  author: String

  "Date du document : `AAAA`, `AAAA-MM` ou `AAAA-MM-JJ`."
  published: String

  "Page, numéro, section ou cote."
  locator: String

  "Lien vers le document."
  url: String!

  "`open` (lu), `paywall` (payant : lien seulement) ou `link_only` (repéré, non lu : aucun énoncé ne s'appuie dessus)."
  access: String!

  "Date de consultation."
  consulted_on: Date!

  "Ce que le document apporte ou sa limite (en français)."
  note: String

  "Licence ou conditions du fournisseur, selon le registre des droits."
  license: String

  "`verified` : licence ouverte écrite et prouvée ; autre valeur : faits seulement, avec lien."
  license_status: String
}

"Image de Wikimedia Commons liée à un accident (gravure, photo de l'époque, lieu, monument)."
type AccidentImage {
  "Nom du fichier sur Commons (`File:…`)."
  file: String!

  "Page du fichier sur Commons."
  page_url: String!

  "Image à afficher."
  image_url: String!

  "Miniature (500 px de large)."
  thumb_url: String

  "Largeur de l'original, en pixels."
  width: Int

  "Hauteur de l'original, en pixels."
  height: Int

  "Auteur selon Commons (« Auteur inconnu » s'il ne l'est pas)."
  author: String!

  "Licence selon Commons."
  license: String!

  "Lien de la licence."
  license_url: String

  "Date de l'image selon Commons (texte libre)."
  date: String

  "Légende rédigée par VFF."
  caption(
    "Langue : `fr` (par défaut), `en` ou `de`."
    lang: String = "fr"
  ): String!

  "Ligne de crédit à reprendre (auteur, licence, via Wikimedia Commons)."
  attribution: String!
}

"Valeur de la fiche corrigée d'après les documents du contexte."
type AccidentCorrection {
  "`occurred_on`, `occurred_at_time`, `deaths` ou `injuries`."
  field: String!

  "Valeur d'avant, en texte (date `AAAA-MM-JJ`, heure `HH:MM` ou nombre)."
  before: String

  "Valeur retenue, en texte."
  value: String

  "Clés des documents qui l'établissent."
  references: [String!]!

  "Raison de la correction."
  reason(
    "Langue : `fr` (par défaut), `en` ou `de`."
    lang: String = "fr"
  ): String!

  "Vrai quand la valeur ne repose que sur une source (la liste des accidents de Wikipédia) et reste à confirmer."
  single_source: Boolean!
}

"Rattachement d'un accident à une ligne VFF, sur le tracé de l'époque de l'accident."
type AccidentLineLink {
  "Ligne VFF (nulle si elle a disparu de VFF depuis l'import)."
  line: Line

  "Vrai pour la ligne retenue comme lieu de l'accident ; faux pour une ligne au même endroit (tronc commun, jonction) ou citée par une source."
  is_primary: Boolean!

  "Ère dont le tracé a servi au rattachement (décennie qui encadre la date)."
  era_year: Int

  "Distance du lieu au tracé, en mètres."
  distance_m: Int

  "Point kilométrique estimé, en mètres : PK du passage à niveau cité, sinon interpolé entre les deux gares qui encadrent le lieu."
  pk_m: Int

  "Le même PK en notation ferroviaire `km+mmm`."
  pk_label: String

  "Portion : gare d'un côté du lieu. Seule renseignée (`section_to` nulle) : accident en gare. Nulle si le lieu n'est connu qu'à la commune près."
  section_from: Station

  "Portion : gare de l'autre côté du lieu."
  section_to: Station

  "Méthodes : `proximity` (tracé de l'époque), `wikidata` (ligne citée par Wikidata), `wikipedia` (article de ligne cité), `level_crossing` (ligne du passage à niveau)."
  method: [String!]!

  "Confiance : `high`, `medium` ou `low` (commune seule, ligne la plus proche : à vérifier)."
  confidence: String!

  "Score de 0 à 1 : proximité du tracé et concordance des sources."
  score: Float!

  "Titre de l'article de ligne de Wikipédia cité par la source (ex. `Ligne de Paris-Lyon à Marseille-Saint-Charles`). Nul si aucune source ne cite cette ligne."
  cited_as: String

  "Permalien de la source qui cite la ligne (révision lue de la page de Wikipédia). Nul si aucune source ne cite cette ligne."
  cited_url: String
}

"Une source consultée pour un accident."
type AccidentSource {
  "Fournisseur : `wikidata`, `wikipedia`, `bea-tt` (clé du registre des droits de VFF)."
  provider: String!

  "`data` (données structurées), `article` (encyclopédie), `report` (rapport d'enquête), `inventory` (bilan des enquêtes)."
  role: String!

  "Titre de la source (intitulé de l'enquête, titre de l'article, libellé de l'élément)."
  title: String!

  "Lien vers la source (permalien de la révision lue pour Wikipédia)."
  url: String!

  "Licence de la source (CC0 1.0, CC BY-SA 4.0, Licence Ouverte 2.0)."
  license: String!

  "Lien vers le texte de la licence."
  license_url: String

  "Révision lue (oldid Wikipédia, lastrevid Wikidata), en texte."
  revision: String

  "Date de consultation."
  retrieved_at: DateTime!

  "Faits lus dans cette source (date, morts, blessés, coordonnées…), objet JSON sérialisé."
  facts: String
}

"Un train ou un matériel impliqué dans un accident."
type AccidentTrain {
  "Nom de service (`TER`, `TGV`, `Intercités`, `RER C`…), invariable."
  label: String

  "Catégorie quand le service n'est pas nommé : `passenger`, `freight`, `works` (travaux), `test` (essai)."
  category: String

  "Numéro de train, quand il est cité."
  number: String

  "Matériel roulant (en français), quand il est cité."
  material: String

  "Exploitant."
  operator: String

  "Fournisseur qui cite ce train : `wikidata`, `wikipedia` ou `bea-tt`."
  source: String
}

"Un point incertain d'une fiche d'accident."
type AccidentReviewNote {
  "Code stable : `toll_mismatch`, `toll_ambiguous`, `date_mismatch`, `location_commune_only`, `commune_not_found`, `line_uncertain`, `no_line`…"
  code: String!

  "Explication en français."
  label: String!

  "Valeurs en cause (ex. « blessés : Wikidata 14, Wikipédia 18 »)."
  detail: String!
}

"""
Passage à niveau du réseau ferré national, tel que publié par SNCF Réseau (jeu
`liste-des-passages-a-niveau`, ODbL : mention « SNCF Réseau », partage à l'identique des bases
dérivées). État à la date de publication, sans date d'ouverture ni de suppression.
"""
type LevelCrossing {
  "Identifiant de l'installation fixe dans les bases de SNCF Réseau (ex. `30000010436`)."
  id: ID!

  "Libellé SNCF Réseau, en général « PN » et le numéro du passage sur la ligne (ex. `PN 32`)."
  label: String

  """
  Classe SNCF Réseau : 10 à 16 gardés, 17 à 19 barrières automatiques (SAL 2, SAL 2B, SAL 4),
  20 sans barrières ni signalisation lumineuse, 21 sans barrières avec SAL 0, 31 et 32 piétons,
  41 à 46 privés, 0 PN secondaire. Nulle si la source ne la donne pas.
  """
  class: Int

  "Définition de la classe, rédigée par VFF d'après la description du jeu. Nulle si la classe est absente ou hors de la liste officielle."
  class_label(
    "Langue : `fr` (par défaut), `en` ou `de`."
    lang: String = "fr"
  ): String

  """
  Groupe : `automatic` (17 à 19), `guarded` (10 à 16), `no_barrier` (20, 21), `pedestrian`
  (31, 32), `private` (41 à 46), `secondary` (0 : passage compté sur une autre ligne).
  """
  group: String

  "Point kilométrique officiel, en mètres (ex. `112866`), nul s'il est inconnu."
  pk_m: Int

  "Point kilométrique en notation `km+mmm` (ex. `112+866`)."
  pk_label: String

  "Commune, telle que l'écrit SNCF Réseau."
  commune: String

  """
  Voie franchie, libellé brut de SNCF Réseau (`VC` voie communale, `CD 106-0` route
  départementale, `CR` chemin rural…). Pour un PN secondaire : le PN qui porte la classe.
  """
  crossed_way: String

  "Code de ligne SNCF Réseau à 6 chiffres (ex. `070000`)."
  line_code: String!

  "Ligne VFF qui porte ce code, nulle si le code n'a pas de fiche."
  line: Line

  "Latitude WGS 84, au centre du croisement (à moins d'un mètre pour plus de 90 % des PN selon SNCF Réseau)."
  lat: Float!

  "Longitude WGS 84."
  lng: Float!

  "Fournisseur et licence de la donnée (SNCF Réseau, ODbL)."
  provenance: Provenance!
}

"Note d'un contrôle de l'audit des tronçons."
enum AuditGrade {
  "Sûr : les sources sont d'accord, l'écart est dans la tolérance."
  GOOD

  "À revoir : accord partiel, écart au-delà de la cible, source peu précise."
  FAIR

  "Faux ou contredit : une source fiable dit autre chose, ou défaut de géométrie."
  POOR

  "Rien pour juger : aucune source, aucune voie de référence indépendante."
  UNKNOWN
}

"Les quatre notes d'un tronçon ou d'une ligne."
type AuditGrades {
  "Classement : état (en service, fret seul, fermé, déposé…) comparé aux sources datées."
  classification: AuditGrade!

  "Placement : écart du tracé à la voie réelle (cible 1 m, tolérance 5 m)."
  placement: AuditGrade!

  "Exactitude : jonctions, coudes, allers-retours, trous, gares le long de la ligne."
  accuracy: AuditGrade!

  "Tracé : précision connue de la source du dessin."
  trace: AuditGrade!
}

"""
Audit des tronçons d'une ligne à une ère. Méthode et seuils : docs/AUDIT-TRONCONS.md et la
documentation de `GET /api/v1/lines/{line}/audit`.
"""
type LineAudit {
  "Année de l'ère auditée."
  era_year: Int!

  "Date et heure de la passe d'audit (ISO 8601)."
  audited_at: String!

  "Version des règles de notation (`AAAA-MM-JJ.n`)."
  rule_version: String!

  "Notes de la ligne : la note d'un contrôle est `poor` dès que 10 % de la longueur est faux, `fair` dès que 10 % est faux ou à revoir."
  grades: AuditGrades!

  "La plus mauvaise des quatre notes."
  worst_grade: AuditGrade!

  "Score de 0 (tout sûr) à 100 (tout faux), pondéré par la longueur."
  score: Int!

  "Longueur auditée, en mètres."
  length_m: Int!

  "Part de la longueur par note pour chaque contrôle, ex. `{\"placement\": {\"good\": 0.98, \"fair\": 0.02}}`."
  shares: JSON!

  "Contrôles propres à la ligne : `length_ratio` (tracé de référence / longueur officielle), `station_order_inversions`, `reasons`."
  line_checks: JSON!

  """
  Nombre de tronçons après le filtre `grade` (tous les tronçons sans filtre) : la page suivante de
  `segments` commence à `offset + limit` tant que ce rang est inférieur à ce nombre. Même valeur que
  `segments_total` de `GET /api/v1/lines/{line}/audit`.
  """
  segments_total(
    "Ne compter que les tronçons dont la plus mauvaise note vaut celle-ci."
    grade: AuditGrade
  ): Int!

  """
  Tronçons audités, le plus mal noté d'abord, une page à la fois comme l'API REST : 50 par défaut,
  200 au plus (`limit`), à partir du rang `offset`. La synthèse de la ligne (`grades`, `score`,
  `shares`, `line_checks`) porte toujours sur tous les tronçons.
  """
  segments(
    "Ne garder que les tronçons dont la plus mauvaise note vaut celle-ci."
    grade: AuditGrade

    "Nombre de tronçons au plus, de 1 à 200 (50 par défaut)."
    limit: Int = 50

    "Rang du premier tronçon rendu, à partir de 0 (0 par défaut)."
    offset: Int = 0
  ): [SegmentAudit!]!
}

"""
Une page de l'audit des tronçons du réseau (`segmentAudits`), comme le corps de
`GET /api/v1/audits/segments`.
"""
type SegmentAuditPage {
  "Année de l'ère auditée."
  era_year: Int!

  "Nombre de tronçons après les filtres : la page suivante commence à `offset + limit` tant que ce rang est inférieur à ce nombre."
  total: Int!

  "Taille de page appliquée (1 à 200)."
  limit: Int!

  "Rang du premier tronçon de la page."
  offset: Int!

  "Tronçons de la page, dans l'ordre du tri."
  items: [NetworkSegmentAudit!]!
}

"Un tronçon de la liste d'audit du réseau : sa ligne, ses notes et les codes de raison de chaque contrôle (preuves complètes : `Line.audit`)."
type NetworkSegmentAudit {
  "Slug de la ligne du tronçon."
  line_slug: String!

  "Code SNCF Réseau de la ligne, nul pour une ligne sans code."
  line_code: String

  "Nom de la ligne."
  line_name: String!

  "Identifiant du tronçon (`LineSegment.id`), tant que le moteur n'a pas recalculé la ligne."
  segment_id: ID!

  "État du tronçon audité : in_service, single_track, service_track, construction, abandoned, dismantled, razed."
  status: String!

  "Trafic du tronçon audité : passenger, freight, mixed, unknown."
  traffic_type: String

  "Source du dessin (bdtopo, osm, ohm, sncf…), nulle si inconnue."
  trace_source: String

  "Longueur du tronçon, en mètres."
  length_m: Int!

  "Les quatre notes du tronçon."
  grades: AuditGrades!

  "La plus mauvaise des quatre notes."
  worst_grade: AuditGrade!

  "Score de 0 (tout sûr) à 100 (tout faux)."
  score: Int!

  "Codes de raison de chaque contrôle, ex. `{\"placement\": [\"median_over_tolerance\"]}`."
  reasons: JSON!

  "Date et heure de la passe d'audit (ISO 8601)."
  audited_at: String
}

"""
Une page de l'audit des gares du réseau (`stationAudits`), comme le corps de
`GET /api/v1/audits/stations`.
"""
type StationAuditPage {
  "Nombre de gares après les filtres : la page suivante commence à `offset + limit` tant que ce rang est inférieur à ce nombre."
  total: Int!

  "Taille de page appliquée (1 à 200)."
  limit: Int!

  "Rang de la première gare de la page."
  offset: Int!

  "Gares de la page, dans l'ordre du tri."
  items: [NetworkStationAudit!]!
}

"Une gare de la liste d'audit du réseau : note de placement, écarts, notes des dates et contrôles en échec (détail et dates candidates : `Station.audit`)."
type NetworkStationAudit {
  "Identifiant de la gare."
  station_id: ID!

  "Slug de la gare."
  slug: String!

  "Nom de la gare."
  name: String!

  "Code INSEE du département, nul si inconnu."
  department: String

  "Nom de la région, nul si inconnue."
  region: String

  "État actuel de la gare : active, tourist, no_commercial, declassified, gone, planned."
  status: String

  "Source de la position retenue par VFF."
  position_source: String

  "Note de placement : agree, close, isolated, disagree ou none."
  placement_grade: String!

  "Nombre de familles de sources qui donnent une position."
  families: Int!

  "Écart en mètres à la source indépendante la plus proche, nul sans source."
  nearest_agreeing_m: Int

  "Écart en mètres à la source précise la plus éloignée, nul sans source précise."
  farthest_precise_m: Int

  "Écart en mètres à la voie la plus proche des lignes de la gare, nul sans tracé."
  track_offset_m: Int

  "Note de la date d'ouverture : sourced, estimated, unknown ou not_applicable."
  opening_grade: String!

  "Note de la date de fermeture : sourced, estimated, unknown ou not_applicable (gare ouverte)."
  closure_grade: String!

  "État voyageurs : open, closed ou unknown."
  passenger: String

  "État fret : open, closed ou unknown."
  freight: String

  "Codes des contrôles croisés en échec."
  checks: [String!]!

  "Familles de sources comptées (sncf, osm, bdtopo, wikidata…)."
  sources: [String!]!
}

"Audit d'un tronçon : état audité, quatre notes et leurs preuves."
type SegmentAudit {
  "Identifiant du tronçon (`LineSegment.id`), tant que le moteur n'a pas recalculé la ligne."
  segment_id: ID!

  "État du tronçon audité : in_service, single_track, service_track, construction, abandoned, dismantled, razed."
  status: String!

  "Trafic du tronçon audité : passenger, freight, mixed, unknown."
  traffic_type: String!

  "Source du dessin (bdtopo, osm, ohm, sncf…), nulle si inconnue."
  trace_source: String

  "Longueur du tronçon, en mètres."
  length_m: Int!

  "Les quatre notes du tronçon : classement, placement, exactitude, tracé."
  grades: AuditGrades!

  "La plus mauvaise des quatre notes."
  worst_grade: AuditGrade!

  "Score de 0 (tout sûr) à 100 (tout faux)."
  score: Int!

  """
  Preuves de chaque note (`classification`, `placement`, `accuracy`, `trace`), chacune avec ses
  codes `reasons` : avis de chaque source, distances à la voie réelle, défauts de géométrie,
  précision de la source. Forme décrite dans `GET /api/v1/lines/{line}/audit`.
  """
  evidence: JSON!
}

"""
Profil en long d'une ligne : altitude le long du tracé de référence de la ligne entière (toutes
époques, lignes fermées et déposées comprises), du plus petit PK officiel vers le plus grand. Les
morceaux séparés par un trou du tracé sont tous gardés, la courbe s'interrompt dans le trou
(`gaps`) ; les embranchements viennent ensuite, bout à bout (`branches`). Les distances sont
mesurées le long du parcours depuis son origine, en mètres, trous compris ; le PK estimé de chaque
point est dans `points.pk_m` et `samples.pk_m`. Altitudes en mètres (NGF-IGN69).
"""
type LineProfile {
  "`reference` : tracé de référence, toutes époques ; `era` : profil calculé avant le 21/11/2026 sur le tracé d'une seule ère."
  basis: String!

  "Année de l'ère dont le tracé a été échantillonné (2030 = aujourd'hui) ; nulle pour un profil du référentiel (`basis` = `reference`)."
  era_year: Int

  "Pas d'échantillonnage le long du parcours, en mètres (100 à 250 selon la longueur)."
  step_m: Int!

  "Longueur du parcours profilé, lacunes comprises, en mètres."
  length_m: Int!

  "Longueur du tracé de référence de la ligne, toutes époques, en mètres (épis et raccordements compris)."
  trace_length_m: Int!

  "Longueur du parcours hors trous, en mètres ; nulle pour un profil antérieur au 21/11/2026."
  covered_m: Int

  "Longueur des bouts du référentiel (moins de 100 m chacun) laissés hors du parcours, en mètres ; nulle pour un profil antérieur au 21/11/2026."
  off_path_m: Int

  "Nombre de gares dont le PK officiel sert à caler le PK des points (0 : aucun PK estimé)."
  pk_anchors: Int!

  "Altitudes extrêmes, dénivelés cumulés et déclivité la plus forte."
  summary: LineProfileSummary!

  "Points du profil dans l'ordre du parcours (forme courte ; détail complet dans `samples`)."
  points: [LineProfilePoint!]!

  "Référentiel d'altitude point par point, comme `GET /api/v1/lines/{line}/profile/points` : provenance, interpolation, ouvrage, morceau, embranchement et position de chaque point."
  samples(
    "PK de début en mètres (borne incluse) ; les points sans PK sont exclus dès qu'une borne est donnée."
    pk_from_m: Int

    "PK de fin en mètres (borne incluse)."
    pk_to_m: Int

    "Nombre de points au plus (10 à 5 000). Par défaut : tous."
    max_points: Int
  ): [LineProfileSample!]!

  "Altitude au PK donné (en mètres), comme `GET /api/v1/lines/{line}/altitude` : interpolée entre les deux points qui l'encadrent. Nulle hors du profil, dans un trou ou sans PK calé."
  altitude_at(
    "PK en mètres (même numérotation que `LineProfilePoint.pk_m`)."
    pk_m: Int!
  ): LineProfileAltitude

  "Tunnels et ponts de la BD TOPO sous le parcours."
  structures: [LineProfileStructure!]!

  "Nombre de points de chaque origine d'altitude."
  altitude_sources: LineProfileAltitudeSources!

  "Trous du tracé (aucune altitude entre leurs bornes)."
  gaps: [LineProfileGap!]!

  "Embranchements (épis, raccordements, branches d'un réseau en arbre) mis bout à bout après la ligne principale, chacun après un trou de longueur conventionnelle."
  branches: [LineProfileGap!]!

  "Parties du parcours dont l'altitude est celle du terrain (RGE ALTI) et non celle de la voie."
  terrain_ranges: [LineProfileGap!]!

  "Parties du parcours dont l'altitude est celle de la voie estimée d'après le terrain (`rge_track` : plateforme repérée sur une coupe en travers du RGE ALTI, lissée le long de la ligne)."
  track_estimate_ranges: [LineProfileGap!]!

  "Méthode et erreur mesurée de l'altitude de la voie estimée d'après le terrain ; nulle si le profil n'a aucun point `rge_track`."
  track_estimate: LineProfileTrackEstimate

  "Ligne à crémaillère (liste versionnée d'après Wikipédia) : type, étendue et déclivité publiée par la source. Nul pour une ligne à adhérence."
  rack: LineProfileRack

  "Déclivité la plus forte donnée par une source écrite (Wikipédia : infobox ou texte de l'article ; SNCF Réseau : segment le plus raide du jeu « Caractéristique des voies et déclivité », ODbL), quand la déclivité mesurée n'est pas publiée pour cause de terrain seul, de tunnel ou de points interpolés. Nulle sinon : elle ne remplace jamais une mesure publiée."
  sourced_grade: LineProfileSourcedGrade

  "Déclivité la plus forte donnée par une source écrite (mêmes sources que `sourced_grade`), servie À CÔTÉ de la déclivité mesurée publiée, avec l'écart. Nulle quand la mesure n'est pas publiée (la source est alors dans `sourced_grade`) ou qu'aucune source ne la donne."
  sourced_grade_compared: LineProfileSourcedGradeCompared

  "Vrais trous du tracé de référence, sans les trous conventionnels posés devant chaque embranchement (`branches`) : la courbe s'y interrompt et les chiffres de `summary` ne portent que sur la partie connue."
  trace_holes: LineProfileTraceHoles!

  "Toutes les gares rattachées à la ligne (fermées comprises), projetées sur le parcours."
  stations: [LineProfileStation!]!

  "Date du calcul (ISO 8601)."
  computed_at: String!

  "Provenance et licence des altitudes."
  provenance: Provenance!
}

"Chiffres d'un profil en long. Valeurs indicatives : quelques ‰ d'écart avec la déclivité officielle sont courants."
type LineProfileSummary {
  "Altitude la plus basse du parcours, en mètres."
  min_altitude_m: Float!

  "Altitude la plus haute du parcours, en mètres."
  max_altitude_m: Float!

  "Dénivelé positif cumulé dans le sens du parcours, en mètres : altitudes du terrain moyennées sur 1 km, puis variations de moins de 3 m ignorées (voir `climb_method`)."
  ascent_m: Float!

  "Dénivelé négatif cumulé dans le sens du parcours, en mètres, calculé comme `ascent_m`."
  descent_m: Float!

  "Déclivité la plus forte, en ‰ (mètres par kilomètre) : pente moyenne par moindres carrés sur 1 km, mesurée sur la voie (BD TOPO) à l'intérieur d'un même morceau. Nulle si elle n'est pas publiée (voir `max_grade_withheld`)."
  max_grade_permil: Float

  "Début de la fenêtre de la déclivité la plus forte, en mètres le long du parcours ; nul si non publiée."
  max_grade_from_m: Int

  "Fin de la fenêtre de la déclivité la plus forte, en mètres le long du parcours ; nul si non publiée."
  max_grade_to_m: Int

  "`up` : rampe dans le sens du parcours ; `down` : pente ; nul si non publiée."
  max_grade_direction: String

  "Motif de non-publication de la déclivité : `terrain_only` (altitude du terrain seulement, voie absente de la BD TOPO), `tunnel` (fenêtres surtout en tunnel), `interpolated` (fenêtres surtout interpolées), `rack` (ligne à crémaillère : voir `LineProfile.rack`) ; nul quand elle est publiée, et nul aussi quand aucune portion de 1 km n'est exploitable (parcours trop court : ni valeur ni motif)."
  max_grade_withheld: String

  "Méthode de calcul de `ascent_m` et `descent_m`."
  climb_method: LineProfileClimbMethod!
}

"Méthode des dénivelés cumulés d'un profil."
type LineProfileClimbMethod {
  "`hysteresis` : une variation n'est comptée qu'à partir de `threshold_m` d'écart avec la dernière altitude retenue."
  method: String!

  "Seuil de l'hystérésis, en mètres (3)."
  threshold_m: Float!

  "Largeur de la moyenne glissante appliquée d'abord aux seules altitudes du terrain (RGE ALTI), en mètres (1 000) ; les altitudes de la voie ne sont pas lissées."
  terrain_smoothing_m: Float!
}

"Ligne à crémaillère, d'après l'article de Wikipédia de la ligne."
type LineProfileRack {
  "Type de crémaillère : `strub`, `abt` ou `riggenbach`."
  system: String!

  "`full` : crémaillère sur tout le parcours ; `partial` : sur une partie ; nul si la source ne le dit pas."
  extent: String

  "Déclivité la plus forte publiée par la source, en ‰."
  max_grade_permil: Int!

  "Vrai si la crémaillère ne servait qu'au freinage (tramway de Laon)."
  braking_only: Boolean!

  "Article lu : fournisseur (`wikipedia`), titre, permalien de la révision lue et licence (CC BY-SA 4.0)."
  source: LineProfileRackSource!
}

"Déclivité d'une source écrite, donnée à la place d'une mesure non publiée. Contrôle sur 235 lignes mesurées sur la voie : 141 à 2 ‰ près, 210 à 5 ‰ près (l'infobox donne souvent la pente d'un point, la mesure celle d'une rampe d'1 km)."
type LineProfileSourcedGrade {
  "Déclivité la plus forte selon la source, en ‰ (sans position ni sens)."
  max_grade_permil: Float!

  "Part de la ligne décrite par la source, de 0 à 1 (jeu SNCF, repris à partir de 0,1) ; nulle quand la source porte sur toute la ligne (Wikipédia)."
  covered_share: Float

  "Source : fournisseur (`wikipedia` ou `sncf`), titre, lien (permalien de la révision lue, ou page du jeu SNCF filtrée sur la ligne), licence (CC BY-SA 4.0 ou ODbL 1.0) et attribution (`Wikipédia` ou `SNCF Réseau`)."
  source: LineProfileRackSource!
}

"Déclivité d'une source écrite servie à côté de la déclivité mesurée publiée, jamais à sa place."
type LineProfileSourcedGradeCompared {
  "Déclivité la plus forte selon la source, en ‰ (sans position ni sens)."
  max_grade_permil: Float!

  "Part de la ligne décrite par la source, de 0 à 1 (jeu SNCF) ; nulle quand la source porte sur toute la ligne (Wikipédia)."
  covered_share: Float

  "Écart en ‰, arrondi au dixième : déclivité mesurée (`summary.max_grade_permil`) moins celle de la source ; positif quand la mesure est plus forte. La mesure porte sur une rampe d'1 km, la source souvent sur un point : quelques ‰ d'écart sont ordinaires."
  difference_permil: Float!

  "Source : fournisseur (`wikipedia` ou `sncf`), titre, lien (permalien de la révision lue, ou page du jeu SNCF filtrée sur la ligne), licence et attribution."
  source: LineProfileRackSource!
}

"Trous du tracé de référence sous un profil en long."
type LineProfileTraceHoles {
  "Nombre de trous (0 : tracé continu)."
  count: Int!

  "Longueur cumulée des trous, en mètres, à vol d'oiseau entre leurs bords : la voie disparue était au moins aussi longue."
  length_m: Int!

  "Part des trous dans le parcours (parcours connu plus trous), de 0 à 1 ; nulle pour un profil antérieur au 21/11/2026."
  share: Float

  "Bornes de chaque trou, en mètres le long du parcours."
  ranges: [LineProfileGap!]!
}

"Source écrite d'une donnée du profil (fiche de crémaillère, déclivité sourcée)."
type LineProfileRackSource {
  "Clé du fournisseur (`wikipedia` ; `sncf` pour une déclivité sourcée)."
  provider: String!

  "Titre de l'article, ou nom du jeu de données."
  title: String!

  "Permalien de la révision lue (Wikipédia), ou page du jeu filtrée sur la ligne (SNCF)."
  url: String!

  "Licence de la source (CC BY-SA 4.0 pour Wikipédia, ODbL 1.0 pour SNCF Réseau)."
  license: String!

  "Mention due à l'auteur, à afficher avec la valeur (`Wikipédia`, `SNCF Réseau`) ; nulle pour une fiche de crémaillère (Wikipédia)."
  attribution: String
}

"Un point du profil."
type LineProfilePoint {
  "Distance le long du parcours depuis son origine, en mètres."
  distance_m: Int!

  "Altitude en mètres, arrondie au décimètre ; nulle sans valeur (hors de France, trou)."
  altitude_m: Float

  "PK estimé en mètres, calé sur les PK officiels des gares ; nul sans gare de calage et sur un embranchement."
  pk_m: Int
}

"Un point du référentiel d'altitude d'une ligne (table `line_profile_points`)."
type LineProfileSample {
  "Rang du point dans l'ordre du parcours, à partir de 0."
  seq: Int!

  "Distance le long du parcours depuis son origine, trous compris, en mètres."
  distance_m: Int!

  "PK estimé en mètres, calé sur les PK officiels des gares ; nul sans gare de calage et sur un embranchement."
  pk_m: Int

  "Altitude en mètres (NGF-IGN69), au décimètre ; nulle sans valeur."
  altitude_m: Float

  "Provenance de la mesure : `bdtopo` (altitude de la voie, BD TOPO 3D), `rge_alti` (terrain) ou `rge_track` (voie estimée d'après le terrain, erreur dans `LineProfile.track_estimate`) ; nulle si l'altitude est interpolée, absente ou d'un profil antérieur au 21/11/2026."
  source: String

  "Vrai si l'altitude est interpolée entre deux mesures (tunnel, pont, point aberrant, petit trou)."
  interpolated: Boolean!

  "Ouvrage de la BD TOPO sous le point : `tunnel`, `bridge` ou nul."
  structure: String

  "Morceau continu du parcours (à partir de 0, un nouveau après chaque trou)."
  piece: Int!

  "Embranchement (1, 2…) ; nul sur la ligne principale."
  branch: Int

  "Latitude WGS 84 du point sur le tracé de référence ; nulle si la position est retenue (voir `position_withheld`)."
  lat: Float

  "Longitude WGS 84 du point sur le tracé de référence ; nulle si la position est retenue."
  lng: Float

  "Motif du retrait de la position, quand le tracé sous le point vient d'une source non redistribuable (règle des droits des tracés de l'API) : `licence_not_open` ou `unknown_source` ; nul quand la position est donnée."
  position_withheld: String
}

"Altitude d'une ligne à un PK."
type LineProfileAltitude {
  "PK demandé, en mètres."
  pk_m: Int!

  "Altitude en mètres (NGF-IGN69), au décimètre."
  altitude_m: Float!

  "Distance correspondante le long du parcours, en mètres."
  distance_m: Int!

  "Vrai si l'un des deux points qui encadrent le PK a une altitude interpolée."
  interpolated: Boolean!

  "Provenance des deux mesures qui encadrent le PK (`bdtopo`, `rge_alti`, `rge_track`)."
  sources: [String!]!

