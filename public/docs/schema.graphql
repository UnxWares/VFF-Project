  "Surnom (ex. `Patrick`), nul s'il n'en a pas."
  nickname: String

  "Faits datés, dans l'ordre du récit."
  facts: [MaterialNotableFact!]!

  "Ce que les sources ne disent pas (ex. ce qu'est devenue la rame), nul si rien n'est signalé."
  unknown: String
}

"Fait daté sur une rame remarquable, avec sa source."
type MaterialNotableFact {
  "Nature du fait : `nickname`, `first_of_series`, `built`, `service`, `livery`, `series_withdrawn`, `farewell_livery`, `farewell_paris`, `farewell_lyon`…"
  kind: String!

  "Date (AAAA-MM-JJ), au 1er du mois ou de l'année quand `precision` vaut `month` ou `year` ; nulle pour un fait sans date."
  date: String

  "Fin d'une période (AAAA-MM-JJ), nulle pour une date unique."
  date_to: String

  "Précision de la date : `day`, `month` ou `year` ; nulle sans date."
  precision: String

  "Le fait, reformulé dans la langue demandée."
  text: String!

  "Courte citation exacte de la source, dans sa langue ; nulle quand le fait est reformulé sans phrase à citer."
  quote: String

  "Page citée et ses droits."
  source: MaterialNotableSource!
}

"Source d'un fait sur une rame remarquable."
type MaterialNotableSource {
  "Identifiant de la source dans le fichier de données (ex. `lyonmag-2020-02-27`)."
  id: String!

  "Média ou site qui publie la page (ex. `LyonMag`)."
  publisher: String!

  "Média dont la page rapporte les propos (ex. `France Bleu`), nul si la page parle d'elle-même."
  reported_by: String

  "Date de publication (AAAA-MM-JJ), nulle si inconnue."
  date: String

  "Adresse de la page à citer."
  url: String!

  "Fournisseur dans le registre des droits (`tiers-cites`, `wikipedia-en`)."
  provider: String!

  "Licence ou conditions de réutilisation de la source."
  license: String

  "Statut des droits : `verified`, `uncertain` ou `forbidden`."
  license_status: String
}

"""
État d'utilisation d'une série, tel que le dit une source. Jamais déduit : une date de retrait absente
ne prouve pas qu'une série circule encore.
"""
type MaterialService {
  "`in_service` (en service) ou `withdrawn` (retirée) ; nul si aucune source ne le dit."
  status: String

  "Effectif cité par la source (nombre d'engins en service à la date `as_of`), nul si elle n'en donne pas."
  units_in_service: Int

  "Date à laquelle la source donne cet état : `AAAA-MM-JJ`, `AAAA-MM` ou `AAAA` selon sa précision. Nulle si elle n'en donne pas."
  as_of: String

  "Date à laquelle VFF a lu la source (`AAAA-MM-JJ`)."
  checked_at: String

  "Source : `wikidata` (propriété P5817) ou `wikipedia` (effectif de l'infobox de l'article)."
  source: String

  "Page de la source : élément Wikidata ou version citée de l'article Wikipédia."
  url: String
}

"Un constructeur d'une série de matériel (Wikidata, propriété P176)."
type MaterialBuilder {
