"""
Fiche complète d'une gare : tout ce que montre la page `/stations/{slug}`, au même contrat que
`GET /api/v1/stations/{station}`. La chronologie est sur `Station.events`.
"""
type StationSheet {
  "Statut affiché (voir l'annuaire ; `technical` point technique, `excluded` fiche retirée du réseau ferré)."
  status: String!

  "Statut selon les sources."
  source_status: String

  "Autres noms."
  alt_names: JSON

  "Précision de la date d'ouverture : `day`, `month`, `year`, `range` (ouverture déduite des lignes, bornée par la carte)."
  opened_precision: String

  "Ouverte après cette année (précision `range` de l'ouverture : entre `opened_after` + 1 et l'année de `opened_at`), nulle sinon."
  opened_after: Int

  "Précision de la date de fermeture."
  closed_precision: String

  "Fermée après cette année, date exacte inconnue."
  closed_after: Int

  "Code UIC."
  uic_code: String

  "Élément Wikidata."
  wikidata_id: String

  "Position et fiabilité."
  position: StationPosition!

  "Source de chaque attribut (`name`, `opened_at`, `geom`…) et détail du recalage."
  attribute_sources: JSON

  "Statut à chaque décennie."
  eras: [StationEra!]!

  "Lignes desservies."
  lines: [StationLine!]!

  "Sources rattachées."
  sources: [StationSource!]!

  "Gares à moins de 10 km (12 au plus), de la plus proche à la plus lointaine."
  neighbors: [StationNeighbor!]!

  """
  Liens : page web (`web`) et points d'accès REST liés : chronologie (`events`), médias (`media`),
  accidents dont la gare est la gare la plus proche du lieu (`accidents`), département (`department`,
  nul si inconnu).
  """
  links: JSON

  """
  Vie de la gare en une liste datée, du plus ancien au plus récent, comme la section « Chronologie » de la page :
  événements de la gare (les dates d'un même événement qui se recouvrent ne font qu'une entrée, les autres sources
  dans `also`), début et fin de desserte par chaque ligne, noms portés et datés, accidents dont la gare est la gare
  la plus proche du lieu (3 km au plus, 30 au plus). Même liste que `chronology` de `GET /api/v1/stations/{station}`.
  """
  chronology: [StationChronologyEntry!]!

  """
  Vues aériennes historiques de l'IGN autour de la gare (BD ORTHO historique 1950-1965, 1965-1980, 1980-1995,
  Licence Ouverte 2.0), comme `GET /api/v1/stations/{station}/aerial` : une par période ; l'image répond 404 quand
  la période ne couvre pas la gare.
  """
  aerial_views: [StationAerialView!]!
}

"Une entrée de la chronologie d'une gare."
type StationChronologyEntry {
  """
  Genre : `event` (événement de la gare, voir `type`), `line_start` et `line_end` (début et fin de la desserte par
  une ligne, sans événement de la gare à la même date), `name` (nom porté), `accident` (accident près de la gare).
  """
  kind: String!

  "Nature d'un événement de la gare (`kind` = `event`) : `opening`, `reopening`, `closure_passenger`, `closure_freight`, `closure`, `demolition`."
  type: String

  "Date (`AAAA-MM-JJ`), à lire avec `precision` ; une année seule a pour jour et mois 01."
  date: String!

  """
  Précision de `date` : `day`, `month`, `year`, `decade`, `after` (après l'année), `before` (avant l'année), `range`
  (entre `after` + 1 et l'année de `date` ; sans `after`, au plus tard l'année de `date`).
  """
  precision: String!

  "Borne basse d'un intervalle (précision `range`) : date postérieure à cette année. Nulle sinon."
  after: Int

  "Vrai si la date est déduite (lignes, tracés) et non lue dans une source qui parle de la gare : date estimée."
  estimated: Boolean!

  "Faux pour une date d'ouverture ou de fermeture avancée par une source, mais qui n'est pas celle retenue par la fiche."
  retained: Boolean!

  "Source de la date : `wikidata`, `wikipedia`, `ohm`, `osm`, `correction`, `inferred:line_event`, `line_events` (chronologie de la ligne), `vff_accidents` (fiche d'accident de VFF)…"
  source: String!

  "Lien vers la source, quand il existe."
  source_url: String

  "Autres sources de la même date, moins précises ou égales (`source`, `source_url`, `date`, `precision`, `estimated`, `note`)."
  also: JSON!

  "Précision sur le contexte, rédigée ou citée."
  note: String

  "Lignes dont la desserte commence (`role` = `start`) ou finit (`end`) à cette date : `slug`, `code`, `name`, `role`, `links`."
  lines: JSON!

  "Événement de ligne qui date une desserte (`GET /api/v1/events/{id}`), nul sinon."
  event_id: Int

  "Accident (`kind` = `accident`) : `slug`, `name`, `date`, `date_precision`, `kind`, `deaths`, `injuries`, `distance_m`, `location_precision`, `to_review`, `links`."
  accident: JSON

  "Nom porté (`kind` = `name`) : `name`, `from` (année), `to` (année, nulle si inconnue)."
  name: JSON

  "Liens : `event` (événement de ligne, nul sinon)."
  links: JSON
}

